name: Engineering checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --reporter=json --outputFile=artifacts/unit-integration-results.json
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            artifacts/
            test-results/
          retention-days: 14
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pip install -r research/symbolic-oracle/requirements.txt
      - run: pnpm oracle:vectors
      - run: python research/symbolic-oracle/verify.py
      - run: pnpm oracle:fractions
      - run: python research/symbolic-oracle/curriculum_oracle.py
      - run: python -m unittest discover -s research/symbolic-oracle -p 'test_*.py'
      - run: pnpm oracle:algebra
      - run: python research/symbolic-oracle/curriculum_oracle.py --input artifacts/algebra-oracle-vectors.json --output artifacts/algebra-oracle-results.json
      - run: pnpm oracle:ratios
      - run: python research/symbolic-oracle/curriculum_oracle.py --input artifacts/ratio-oracle-vectors.json --output artifacts/ratio-oracle-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symbolic-oracle
          path: |
            artifacts/oracle-vectors.json
            artifacts/sympy-results.json
            artifacts/fraction-oracle-vectors.json
            artifacts/fraction-oracle-results.json
            artifacts/algebra-oracle-vectors.json
            artifacts/algebra-oracle-results.json
            artifacts/ratio-oracle-vectors.json
            artifacts/ratio-oracle-results.json
  ocr-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r research/ocr-benchmarks/requirements-test.txt
      - run: ruff check research/ocr-benchmarks services/ocr-worker/python
      - run: ruff format --check research/ocr-benchmarks services/ocr-worker/python
      - run: pytest research/ocr-benchmarks services/ocr-worker/python --junitxml=artifacts/ocr-metric-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-metric-tests
          path: artifacts/ocr-metric-tests.xml
